<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email - SyncroEdit</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="shortcut icon" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script src="/js/dev-cache-reset.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/css/pages/auth-flow.css" />
    <link rel="stylesheet" href="../css/syncro.css" />
  </head>
  <body data-page="verify">
    <div class="login-container">
      <div class="left-section">
        <a class="auth-brand" href="/pages/login.html" aria-label="SyncroEdit login"
          ><img src="/logo.svg" alt="" width="36" height="36" /><span>SyncroEdit</span></a
        >
        <div class="heading">Verify your email</div>
        <p class="muted" id="introText">
          We sent a 6-digit code to your email. Enter it below to continue.
        </p>
        <div class="email-tag" id="emailTag">
          <i class="fas fa-envelope"></i><span id="emailValue">example@email.com</span>
        </div>

        <label class="field-label" for="codeInput">Verification code</label>
        <input
          id="codeInput"
          class="code-input"
          type="text"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="000000"
        />

        <div class="actions">
          <button id="verifyBtn" class="btn btn-primary" type="button">Verify code</button>
          <button id="resendBtn" class="btn btn-secondary" type="button">Resend code</button>
        </div>

        <div class="status" id="statusMessage" role="status" aria-live="polite"></div>

        <div class="footer">
          <span id="lastMessage"></span>
          <a class="link" href="login.html">Back to login</a>
        </div>
      </div>

      <div class="right-section">
        <div class="character-container">
          <div class="bot-rig" id="botRig">
            <div class="antenna-stalk"></div>
            <div class="antenna-bulb"></div>
            <div class="head">
              <div class="face-screen">
                <div class="loader"></div>
                <div class="eyes-container">
                  <div class="eye left">
                    <div class="eyelid top"></div>
                    <div class="pupil"></div>
                    <div class="eyelid bottom"></div>
                  </div>
                  <div class="eye right">
                    <div class="eyelid top"></div>
                    <div class="pupil"></div>
                    <div class="eyelid bottom"></div>
                  </div>
                </div>
                <div class="mouth"></div>
              </div>
            </div>
            <div class="hands-container">
              <div class="hand left"></div>
              <div class="hand right"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
