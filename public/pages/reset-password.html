<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncroEdit - Set New Password</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="shortcut icon" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script src="/js/dev-cache-reset.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/css/pages/auth-flow.css" />
    <link rel="stylesheet" href="../css/syncro.css" />
  </head>
  <body data-page="reset-password">
    <div class="login-container">
      <div class="left-section">
        <a class="auth-brand" href="/pages/login.html" aria-label="SyncroEdit login"
          ><img src="/logo.svg" alt="" width="36" height="36" /><span>SyncroEdit</span></a
        >
        <div class="title">New Password</div>
        <div class="subtitle">Secure your account with a strong password</div>

        <div class="input-group">
          <label for="usernameConfirm">Confirm Username</label>
          <input
            type="text"
            id="usernameConfirm"
            placeholder="Enter your username"
            autocomplete="username"
          />
        </div>

        <div class="input-group">
          <label for="password">New Password</label>
          <input
            type="password"
            id="password"
            placeholder="8+ chars, numbers & symbols"
            autocomplete="new-password"
          />
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Repeat password"
            autocomplete="new-password"
          />
        </div>

        <div class="input-group" id="mfaGroup" style="display: none">
          <label for="mfaCode">2FA Code</label>
          <input type="text" id="mfaCode" placeholder="Enter 6-digit code" maxlength="6" />
        </div>

        <button class="action-btn" id="resetBtn" type="button">Set New Password</button>
        <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>

        <div class="back-link">
          <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
      </div>

      <div class="right-section">
        <div class="character-container">
          <div class="bot-rig" id="botRig">
            <div class="antenna-stalk"></div>
            <div class="antenna-bulb"></div>
            <div class="head">
              <div class="face-screen">
                <div class="loader"></div>
                <div class="eyes-container">
                  <div class="eye left">
                    <div class="eyelid top"></div>
                    <div class="pupil"></div>
                    <div class="eyelid bottom"></div>
                  </div>
                  <div class="eye right">
                    <div class="eyelid top"></div>
                    <div class="pupil"></div>
                    <div class="eyelid bottom"></div>
                  </div>
                </div>
                <div class="mouth"></div>
              </div>
            </div>
            <div class="hands-container">
              <div class="hand left"></div>
              <div class="hand right"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
