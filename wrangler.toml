name = "syncroedit"
account_id = "3c616f4db02149046562a2fa51a6440b"
main = "src-worker/index.js"
compatibility_date = "2026-06-10"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "synchroedit-db"
database_id = "22d0142f-5997-4622-bd2d-33eab48beeea"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "DocumentSyncObject"

[[durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "RateLimitObject"

[exports.DocumentSyncObject]
type = "durable-object"
storage = "sqlite"

[exports.RateLimitObject]
type = "durable-object"
storage = "sqlite"

# These names were provisioned by earlier production deployments. Keep them
# declared as live compatibility exports even though current bindings use the
# non-Synchro aliases; Cloudflare rejects silent namespace drift.
[exports.SynchroDocumentObject]
type = "durable-object"
storage = "sqlite"

[exports.SynchroRateLimitObject]
type = "durable-object"
storage = "sqlite"

[vars]
EMAIL_FROM = "SyncroEdit <no-reply@syncroedit.online>"
APP_NAME = "SyncroEdit"
APP_URL = "https://syncroedit.online"

[env.local]
name = "syncroedit-production-local"
workers_dev = true

[[env.local.d1_databases]]
binding = "DB"
database_name = "syncroedit-local-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.local.durable_objects.bindings]]
name = "DOCUMENT_SYNC_OBJECT"
class_name = "SynchroDocumentObject"

[[env.local.durable_objects.bindings]]
name = "RATE_LIMIT_OBJECT"
class_name = "SynchroRateLimitObject"

[env.local.exports.SynchroDocumentObject]
type = "durable-object"
storage = "sqlite"

[env.local.exports.SynchroRateLimitObject]
type = "durable-object"
storage = "sqlite"

[env.local.vars]
EMAIL_FROM = "SyncroEdit <verify@example.com>"
APP_NAME = "SyncroEdit"
APP_URL = "http://localhost:8788"
